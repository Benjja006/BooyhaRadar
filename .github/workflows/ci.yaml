name: BooyhaRadar CI y ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar-build:
    name: Validar ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./code/auth-service
          - service: player-service
            context: ./code/player-service
          - service: statistics-service
            context: ./code/statistics-service
          - service: organization-service
            context: ./code/organization-service
          - service: scouting-service
            context: ./code/scouting-Service

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: booyharadar/${{ matrix.service }}:${{ github.sha }}

  publicar-ecr:
    name: Publicar ${{ matrix.service }} en ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validar-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./code/auth-service
            ecr_secret: ECR_AUTH_REPOSITORY
          - service: player-service
            context: ./code/player-service
            ecr_secret: ECR_PLAYER_REPOSITORY
          - service: statistics-service
            context: ./code/statistics-service
            ecr_secret: ECR_STATISTICS_REPOSITORY
          - service: organization-service
            context: ./code/organization-service
            ecr_secret: ECR_ORGANIZATION_REPOSITORY
          - service: scouting-service
            context: ./code/scouting-Service
            ecr_secret: ECR_SCOUTING_REPOSITORY

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar acceso a AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Iniciar sesión en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets[matrix.ecr_secret] }}:${{ github.sha }}

  desplegar-ec2:
    name: Desplegar en ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publicar-ecr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: booyharadar-app-01
            instance_secret: APP01_INSTANCE_ID
            services: player-service statistics-service scouting-service
          - target: booyharadar-app-02
            instance_secret: APP02_INSTANCE_ID
            services: auth-service organization-service

    steps:
      - name: Configurar acceso a AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Actualizar servicios mediante SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets[matrix.instance_secret] }}
          SERVICES: ${{ matrix.services }}
        run: |
          set -euo pipefail

          REGISTRY="815649369288.dkr.ecr.us-east-1.amazonaws.com"
          REPO_DIR="/home/ssm-user/BooyhaRadar"

          COMMANDS_JSON="$(jq -cn \
            --arg region "$AWS_REGION" \
            --arg image_tag "$IMAGE_TAG" \
            --arg services "$SERVICES" \
            --arg repo_dir "$REPO_DIR" \
            --arg registry "$REGISTRY" \
            '[
              ("sudo -u ssm-user git -C " + $repo_dir + " pull --ff-only origin main"),
              ("cd " + $repo_dir + "/code && aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $registry),
              ("cd " + $repo_dir + "/code && sudo env IMAGE_TAG=" + $image_tag + " docker compose pull " + $services),
              ("cd " + $repo_dir + "/code && sudo env IMAGE_TAG=" + $image_tag + " docker compose up -d --no-build " + $services)
            ]')"

          PARAMETERS="$(jq -cn --argjson commands "$COMMANDS_JSON" '{commands: $commands}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy BooyhaRadar $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment did not finish successfully. Status: $STATUS"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text


spring.application.name=api-gateway
server.port=8080

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Player Service
spring.cloud.gateway.server.webflux.routes[1].id=player-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/jugadores/**

# Statistics Service
spring.cloud.gateway.server.webflux.routes[2].id=statistics-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/estadisticas/**

# Organization Service
spring.cloud.gateway.server.webflux.routes[3].id=organization-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/organizaciones/**

# Scouting Service
spring.cloud.gateway.server.webflux.routes[4].id=scouting-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/scouting/**,/favoritos/**
